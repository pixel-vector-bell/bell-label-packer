name: build-apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller
      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed
          --name "BellLabelPacker"
          label_packer.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BellLabelPacker-windows
          path: dist/BellLabelPacker.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller
      - name: Build .app
        run: >
          pyinstaller --windowed
          --name "BellLabelPacker"
          label_packer.py
      - name: Zip the .app
        run: |
          cd dist
          zip -r -y BellLabelPacker-mac.zip BellLabelPacker.app
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: BellLabelPacker-mac
          path: dist/BellLabelPacker-mac.zip
